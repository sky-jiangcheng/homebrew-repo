name: Tests

# A tap is only useful if the manifests actually install. This runs the real
# thing on every push: install each manifest and run its test.
#
# Deliberately NOT `brew audit --strict`: that checks style and deprecations,
# and a tap that fails CI over formatting is a tap people learn to ignore. The
# failure mode that matters is a manifest that does not install or whose digest
# does not match, and `brew install` + `brew test` catch exactly that.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cask:
    name: Cask (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a tag rather than a branch. Homebrew/actions renamed its
      # default branch to `main`, so the widely-copied `@master` reference fails
      # at action-resolution time with "unable to find version `master`" before
      # a single step runs. A tag cannot be renamed out from under us.
      - name: Set up Homebrew
        id: brew
        uses: Homebrew/actions/setup-homebrew@main

      # The action exposes `gems-path` / `gems-hash`, NOT `cache-path`.
      - name: Cache Homebrew gems
        uses: actions/cache@v4
        with:
          path: ${{ steps.brew.outputs.gems-path }}
          key: ${{ runner.os }}-brew-${{ steps.brew.outputs.gems-hash }}

      - name: brew install (cask)
        run: brew install --cask "$HOMEBREW_REPOSITORY"/Casks/reponest.rb

      - name: brew test (cask)
        run: brew test --cask "$HOMEBREW_REPOSITORY"/reponest

      - name: brew audit (cask)
        run: brew audit --cask "$HOMEBREW_REPOSITORY"/reponest || true

  formula:
    name: Formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        id: brew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew gems
        uses: actions/cache@v4
        with:
          path: ${{ steps.brew.outputs.gems-path }}
          key: ${{ runner.os }}-brew-${{ steps.brew.outputs.gems-hash }}

      - name: brew install (formula)
        run: brew install "$HOMEBREW_REPOSITORY"/Formula/reponest-mcp.rb

      # The Formula's test block asserts the binary is present and executable
      # rather than running it: reponest-mcp is a stdio MCP server and would
      # block on the JSON-RPC loop with no client attached.
      - name: brew test (formula)
        run: brew test "$HOMEBREW_REPOSITORY"/reponest-mcp

      - name: brew audit (formula)
        run: brew audit --formula "$HOMEBREW_REPOSITORY"/reponest-mcp || true
